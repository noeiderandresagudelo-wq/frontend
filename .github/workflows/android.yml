name: Build Alarvix Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Secrets aceptados en ambos formatos para no romper instalaciones existentes.
      # Vite necesita el prefijo VITE_ para sustituir %VITE_*% dentro de index.html.
      VITE_SUPABASE_URL: https://ocggspjpdvqisesdorrn.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_Sfh_MgCK5f9jljnDRv5qGw_zEb1sksk
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Verify Supabase build configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "ERROR: Falta VITE_SUPABASE_URL/SUPABASE_URL en GitHub Secrets" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "ERROR: Falta VITE_SUPABASE_ANON_KEY/SUPABASE_ANON_KEY en GitHub Secrets" && exit 1)
          if grep -q '%VITE_SUPABASE_URL%' dist/index.html; then
            echo "ERROR: VITE_SUPABASE_URL no fue inyectada en dist/index.html"
            exit 1
          fi
          if grep -q '%VITE_SUPABASE_ANON_KEY%' dist/index.html; then
            echo "ERROR: VITE_SUPABASE_ANON_KEY no fue inyectada en dist/index.html"
            exit 1
          fi
          echo "Supabase URL inyectada correctamente en el build web."

      - name: Install Android wrapper dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Generate Alarvix icon and splash assets from the exact web logo
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p mobile/resources
          test -f dist/icons/icon-512.png

          # Use the same Alarvix presentation logo already used by the web/PWA.
          # The source is upscaled only to satisfy native asset minimum dimensions;
          # the logo artwork itself is not changed.
          convert dist/icons/icon-512.png -resize 1024x1024 mobile/resources/logo.png
          cp mobile/resources/logo.png mobile/resources/logo-dark.png

          cd mobile
          npm install --no-save @capacitor/assets
          npx @capacitor/assets generate --android             --assetPath resources             --iconBackgroundColor "#0B0F19"             --iconBackgroundColorDark "#0B0F19"             --splashBackgroundColor "#0B0F19"             --splashBackgroundColorDark "#0B0F19"             --logoSplashScale 0.28

          # Ensure the generated native splash resource exists; otherwise fail
          # instead of producing an APK with the default Capacitor logo.
          test -f android/app/src/main/res/drawable/splash.png || \
            test -f android/app/src/main/res/drawable/splash.webp || \
            (echo "ERROR: No se generó el splash nativo de Alarvix." && exit 1)

      - name: Sync Capacitor plugins and latest web build
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alarvix-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
